# Test the Python packages in this repository.
#
# The packages are installed from this repository and are not published, so
# this workflow only tests them: on every push to main, on every pull request,
# including the ones Dependabot opens for their dependencies.
name: python packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit, not by tag, because a tag can be moved to point at
      # different code. These are the commits this organisation already uses.
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      # A pip that can refuse recent uploads, so the ten-day rule covers the
      # dependencies of dependencies too, which no pyproject.toml pins.
      - run: python -m pip install pip==26.2.1
      # From their folders, because neither package is on PyPI, and
      # ifc-converter needs ifc-explorer.
      - run: >-
          python -m pip install --uploaded-prior-to P10D
          -e "python/ifc-explorer[test]" -e "python/ifc-converter[test]"
      # From each package's folder, where its pyproject.toml names its tests.
      - run: python -m pytest
        working-directory: python/ifc-explorer
      - run: python -m pytest
        working-directory: python/ifc-converter
