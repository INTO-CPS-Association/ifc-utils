# Build, test and publish the npm packages in this repository.
#
# Publishing happens on a release and on nothing else. The sibling package in
# this organisation, threed-glb-viewer, also triggers on `push` and
# `pull_request`: that republishes on every commit and lets a pull request from
# a fork start a publish, which is a supply chain surface for no benefit.
#
# Everything runs at the root rather than inside each package. The packages are
# npm workspaces and one of them depends on the other, so installing inside a
# package directory sends npm to the registry for a sibling that is not
# published there. That is what this workflow did first, and the build failed
# on a module that exists three directories away.
name: npm packages

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # At the root, which is what links the workspaces to each other.
      - run: npm ci
      # Fails the build on a known high or critical advisory, rather than
      # leaving it to whoever remembers to look.
      - run: npm run audit
      # The root script builds in dependency order, which `--workspaces` does
      # not do on its own.
      - run: npm run build
      # The tests import from dist/, so building first is what makes them a
      # check of the published artifact rather than of the source.
      - run: npm test

  publish:
    if: github.event_name == 'release'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm ci
      - run: npm run build
      # Both, and the converter first. The viewer declares a dependency on it,
      # so publishing the viewer alone puts a package on the registry whose
      # dependency is not there.
      - run: npm publish --workspace packages/bim-ifc-converter
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm publish --workspace packages/bim-glb-viewer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
