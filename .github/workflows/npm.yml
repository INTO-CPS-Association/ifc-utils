# Build, test and publish the npm packages in this repository.
#
# Publishing happens on a release and on nothing else. The sibling package in
# this organisation, threed-glb-viewer, also triggers on `push` and
# `pull_request`: that republishes on every commit and lets a pull request from
# a fork start a publish, which is a supply chain surface for no benefit.
#
# Everything runs at the root, which is where the workspace is defined.
name: npm packages

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # At the root, which is what links the workspaces to each other.
      - run: npm ci
      # Fails the build on a known high or critical advisory, instead of
      # leaving it to whoever remembers to look.
      - run: npm run audit
      # The root script builds in dependency order, which `--workspaces` does
      # not do on its own.
      - run: npm run build
      # The tests import from dist/, so building first is what makes them a
      # check of the published artifact instead of of the source.
      - run: npm test

  # Two registries, which is what this organisation already does for libms and
  # runner. GitHub Packages requires a token to install even a public package,
  # so a DTaaS contributor cloning the client would need a personal token just
  # to run yarn install. npmjs needs none. Publishing to both means the
  # organisation keeps its own copy and a consumer needs nothing.
  publish-github:
    if: github.event_name == 'release'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Pinned by commit, not by tag, because a tag can be moved to point at
      # different code. These are the commits this organisation already uses.
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm ci
      - run: npm run build
      - run: npm publish --workspace packages/bim-kit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # npmjs publishing uses OIDC trusted publishing, so no long-lived token is
  # stored in the repository. The runner exchanges a short-lived identity for a
  # one-time publish credential, and npm records build provenance automatically.
  # The trusted publisher for this package must be configured once on npmjs,
  # under the package's publishing access, to point at this repository and this
  # workflow file. A stored token would be a credential that can leak, which is
  # what this avoids.
  publish-npmjs:
    if: github.event_name == 'release'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or newer, and node 22 ships npm 10.
      - run: npm install -g npm@11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm publish --workspace packages/bim-kit
