# Keep dependencies current on the same weekly rhythm the DTaaS repository
# uses, so a person reviews both on the same day.
#
# Three rules apply below:
#
# - Cooldown. A release is proposed only once it is ten days old, which is this
#   repository's supply-chain rule: a malicious release is usually found and
#   pulled within days. Dependabot applies it to npm and pip version updates.
#   Security updates skip it by design, because waiting on a known
#   vulnerability is the greater risk. Dependabot has no cooldown for GitHub
#   Actions, so an action update younger than ten days is left to age before
#   it is merged.
# - Groups. Minor and patch updates arrive as one pull request per ecosystem
#   each week, so they are reviewed together instead of piling up one per
#   package. Major updates stay one per package, because those are the ones
#   that break and need to be read one at a time.
# - Security updates are grouped as well, so one advisory that touches several
#   packages is one pull request.
version: 2
updates:
  # The npm workspace. Its lock file is at the root and covers packages/*, so
  # the root is the directory to update. Updating packages/bim-kit on its own
  # changed its package.json without the lock file, and npm ci then failed on
  # every pull request.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 10
    commit-message:
      prefix: "npm: "
    # @babel/parser is pinned at the root only to fix what the Babel 7 packages
    # under @emotion resolve. A major version of it would hand those packages a
    # parser from Babel 8, whose syntax tree they were not written for. It moves
    # to 8 when @emotion does, and not on its own.
    ignore:
      - dependency-name: "@babel/parser"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # The two Python packages pin exact versions in pyproject.toml.
  - package-ecosystem: "pip"
    directories:
      - "/python/ifc-explorer"
      - "/python/ifc-converter"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 10
    commit-message:
      prefix: "python: "
    # ifc-explorer is the sibling package in this repository, installed from
    # its folder. The name is not on PyPI, so anyone could register it there,
    # and Dependabot would then propose that stranger's release.
    ignore:
      - dependency-name: "ifc-explorer"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  # The actions the workflows use, whether named by tag or pinned to a commit.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    commit-message:
      prefix: "actions: "
    groups:
      actions:
        patterns: ["*"]
